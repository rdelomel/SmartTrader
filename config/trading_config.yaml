# ============================================================
# SmartTrader Configuration v3.1
# Updated: 2026-07-25
# Changes from v3 (profitability / drought fix):
#   - Raise quality gates (0.48/0.50) — do NOT chase volume via 0.35
#   - disable_short_trades: true until long-only expectancy is positive
#   - Prune scalping/news/EOD/day_trading on 1h; reweight remaining to 1.0
#   - Global R:R 1:3; trail activates after 1R (see stop_loss.py)
#   - Pattern forecaster wired into orchestrator (main.py)
# ============================================================

# Signal Log Mode
# When true: all signals are logged to logs/signals.jsonl but NO orders are placed
# Use this for 2 weeks to calibrate thresholds before turning it off
signal_log_mode: false  # LIVE TRADING ENABLED

# Broker sync (startup)
# When sync_filled_order_history is true, Alpaca/OANDA filled orders are imported
# into trading.db as *_order_sync and flood Recent Trades after every wipe/restart.
# Keep false for clean agent-only monitoring. Open positions still sync below.
broker_sync:
  sync_filled_order_history: false
  sync_open_positions: true
  show_synced_trades_on_dashboard: false

# Aggressive Trading Mode
aggressive_mode:
  enabled: true
  target_monthly_return: 3.0     # Realistic: 3% per MONTH
  max_drawdown: 10
  use_drl: false                 # Re-enable once baseline is profitable
  volatility_scaling: true
  circuit_breakers: true

# Multi-Agent Framework
# Agent weights MUST sum to 1.0
agents:
  technical:
    enabled: true
    ml_weight: 0.3
    lstm_weight: 0.15

  sentiment:
    enabled: true
    sentiment_threshold: 0.30

  fundamental:
    enabled: true

  quantitative:
    enabled: true
    lookback_period: 100
    min_confidence: 0.48
    use_statistical_models: true
    use_momentum_models: true
    use_mean_reversion_models: true

  pattern_forecaster:
    enabled: true
    pattern_length: 20
    lookahead_periods: 10
    min_matches: 3
    similarity_threshold: 0.65
    correlation_threshold: 0.60
    historical_lookback_days: 180
    max_historical_records: 5000
    max_historical_bars: 2000
    analysis_timeout_seconds: 30

  regime_switching:
    enabled: true
    n_regimes: 4
    use_hmm: true
    lookback_period: 100

  risk_manager:
    enabled: true
    max_position_size_percent: 4.0
    max_drawdown_percent: 4.5
    min_liquidity_ratio: 0.1
    max_slippage_bps: 10
    veto_enabled: true
    circuit_breaker:
      use_atr_based: true
      daily_loss_atr_multiple: 2.5
      hourly_loss_atr_multiple: 1.2
      max_daily_loss_percent: 2.5
      max_hourly_loss_percent: 1.0
      max_drawdown_percent: 5.0
      cooling_period_hours: 2

  orchestrator:
    enabled: true
    min_confidence: 0.35         # Lowered — 0.42 + HOLD dilution caused weeks of zero fills
    consensus_threshold: 0.35
    require_agent_agreement: true
    min_agents_agreeing: 1       # Single strong agent can lead; was 2 and starved entries
    disable_short_trades: false  # Re-enabled — long-only starved entries when signals were SELL-heavy
    risk_reward_ratio: 3.0
    # Voting weights (normalized in code if they do not sum to 1.0)
    technical_weight: 0.35
    sentiment_weight: 0.15
    fundamental_weight: 0.10
    quantitative_weight: 0.25
    pattern_forecaster_weight: 0.15

# Strategy Weights (MUST sum to 1.0)
# Pruned for 1h timeframe: disabled scalping/news/EOD/day_trading
strategies:
  trend_following:
    enabled: true
    weight: 0.28
    regimes: [trending]

  momentum:
    enabled: true
    weight: 0.20
    regimes: [trending, neutral]

  breakout:
    enabled: true
    weight: 0.18
    regimes: [trending, volatile]

  mean_reversion:
    enabled: true               # auto-disables itself for crypto (see strategy code)
    weight: 0.12
    regimes: [ranging]

  day_trading:
    enabled: false              # Conflicts with swing on 1h
    weight: 0.0
    regimes: [trending, neutral, ranging]

  volatility:
    enabled: true
    weight: 0.12
    regimes: [volatile, ranging]

  swing_trading:
    enabled: true
    weight: 0.10
    regimes: [trending, ranging]

  news_trading:
    enabled: false              # Too noisy on 1h research blend
    weight: 0.0
    regimes: [volatile]

  end_of_day:
    enabled: false              # Session-close logic conflicts with 1h bars
    weight: 0.0
    regimes: [trending, neutral, ranging]

  scalping:
    enabled: false              # Latency-sensitive; unsuitable for this loop
    weight: 0.0
    regimes: [trending, neutral, ranging]

# Asset Classes & Symbols
assets:
  crypto:
    enabled: true
    broker: alpaca
    fallback_broker: alpaca
    symbols:
      - BTC/USD
      - ETH/USD
      - SOL/USD
      - AVAX/USD
    timeframe: 1h
    max_positions: 2
    trading_hours:
      allowed_days: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]

  forex:
    enabled: true
    broker: oanda
    symbols:
      - EUR_USD
      - GBP_USD
      - USD_JPY
      - AUD_USD
    timeframe: 1h
    max_positions: 2
    trading_hours:
      start: "00:00"
      end: "23:59"
      timezone: UTC
      exclude_weekends: true
      allowed_days: [monday, tuesday, wednesday, thursday, friday]

  commodities:
    enabled: true
    broker: oanda
    symbols:
      - XAU_USD
      - XAG_USD
    timeframe: 1h
    max_positions: 1
    trading_hours:
      start: "01:00"
      end: "22:00"
      timezone: UTC
      exclude_weekends: true
      allowed_days: [monday, tuesday, wednesday, thursday, friday]

  stocks:
    enabled: false
    broker: alpaca
    symbols: []

# Risk Management
risk:
  max_portfolio_risk_percent: 2.0
  max_position_size_percent: 4.0
  position_size_percent: 1.0           # Base risk % before Kelly fraction
  default_stop_loss_atr_multiple: 1.5
  default_take_profit_rr_ratio: 3.0    # 1:3 R:R — breakeven ~25% WR if realized
  position_sizing_method: kelly
  method: kelly                        # PositionSizer reads 'method'
  kelly_fraction: 0.25
  max_correlated_positions: 2
  # Trailing: only after >=1R profit; never lock in less than min_lock_rr
  trailing_stop_enabled: true
  trailing_stop_atr_multiplier: 1.5
  trailing_activation_rr: 1.0          # Activate trail after 1R unrealized
  trailing_min_lock_rr: 0.5            # Do not trail so tight that locked R < 0.5
  # If recent PF < min_profit_factor_for_kelly over last N trades, use fixed % risk
  expectancy_clamp:
    enabled: true
    lookback_trades: 30
    min_profit_factor_for_kelly: 1.3
    fallback_risk_percent: 0.75        # Conservative fixed risk when expectancy unknown/negative


# ============================================================
# Per-Asset-Class Strategy Configuration
# ============================================================
asset_class_strategy_config:

  crypto:
    min_confidence: 0.35         # Align with orchestrator — was blocking above orchestrator floor
    consensus_threshold: 0.35
    mean_reversion_enabled: false
    stop_loss_atr_multiple: 1.5
    take_profit_rr_ratio: 3.0
    trend_following:
      use_ema: true
      fast_ma_period: 10
      slow_ma_period: 25
      adx_min_trend: 30
    momentum:
      rsi_oversold: 25
      rsi_overbought: 75
      min_momentum: 0.05

  forex:
    min_confidence: 0.35
    consensus_threshold: 0.35
    mean_reversion_enabled: true
    stop_loss_atr_multiple: 1.5
    take_profit_rr_ratio: 3.0
    trend_following:
      use_ema: true
      fast_ma_period: 10
      slow_ma_period: 30
      adx_min_trend: 20
    momentum:
      rsi_oversold: 35
      rsi_overbought: 65
      min_momentum: 0.005

  commodities:
    min_confidence: 0.35
    consensus_threshold: 0.35
    mean_reversion_enabled: true
    stop_loss_atr_multiple: 2.0
    take_profit_rr_ratio: 3.0
    trend_following:
      use_ema: true
      fast_ma_period: 20
      slow_ma_period: 50
      adx_min_trend: 22
    momentum:
      rsi_oversold: 32
      rsi_overbought: 68
      min_momentum: 0.008

  stocks:
    min_confidence: 0.35
    consensus_threshold: 0.35
    mean_reversion_enabled: true
    stop_loss_atr_multiple: 2.0
    take_profit_rr_ratio: 3.0
    trend_following:
      use_ema: false
      fast_ma_period: 20
      slow_ma_period: 50
      adx_min_trend: 20
    momentum:
      rsi_oversold: 30
      rsi_overbought: 70
      min_momentum: 0.02


# Performance Gates (before enabling live trading)
live_trading_gates:
  min_paper_trading_days: 60
  min_sharpe_ratio: 1.0
  min_win_rate: 0.48
  max_drawdown_percent: 8.0
  min_profit_factor: 1.3
