# Trading Configuration

# Aggressive Trading Mode Configuration
aggressive_mode:
  enabled: true  # Set to true to enable aggressive DRL-based trading
  target_weekly_return: 3.0  # Target weekly return percentage (3% per week)
  max_drawdown: 4.5  # Maximum drawdown percentage
  use_drl: true  # Use Deep Reinforcement Learning for decisions
  volatility_scaling: true  # Use volatility-based position sizing
  circuit_breakers: true  # Enable real-time circuit breakers

# Multi-Agent Framework Configuration
agents:
  technical:
    enabled: true
    ml_weight: 0.3
    lstm_weight: 0.15
  
  sentiment:
    enabled: true
    sentiment_threshold: 0.25  # Lowered from 0.3 for more responsive sentiment signals
  
  fundamental:
    enabled: true
  
  quantitative:
    enabled: true
    lookback_period: 50  # Reduced from 100 to 50 - allows trading on less historical data
    min_confidence: 0.4  # Reduced from 0.5 to 0.4 - allow more quantitative signals
    use_statistical_models: true
    use_momentum_models: true
    use_mean_reversion_models: true
  
  pattern_forecaster:
    enabled: true
    pattern_length: 20  # Number of bars in a pattern
    lookahead_periods: 10  # Periods to forecast ahead
    min_matches: 2  # Reduced from 3 to 2 - allow fewer matches for more signals
    similarity_threshold: 0.6  # Reduced from 0.7 to 0.6 - less strict matching
    correlation_threshold: 0.5  # Reduced from 0.6 to 0.5 - less strict correlation
    historical_lookback_days: 90  # Reduced from 180 to 90 days - faster queries
    max_historical_records: 3000  # Reduced from 5000 to 3000 - faster queries
    max_historical_bars: 1500  # Reduced from 2000 to 1500 - faster processing
    analysis_timeout_seconds: 15  # Reduced from 30 to 15 seconds - faster failure recovery
  
  regime_switching:
    enabled: true
    n_regimes: 4
    use_hmm: true
    lookback_period: 100
  
  risk_manager:
    enabled: true
    max_position_size_percent: 4.0  # Aligned with risk.max_position_size_percent
    max_drawdown_percent: 4.5  # Aligned with aggressive_mode max_drawdown
    min_liquidity_ratio: 0.1
    max_slippage_bps: 10
    veto_enabled: true
    circuit_breaker:
      max_daily_loss_percent: 1.0  # Tighter daily loss limit to protect 4.5% DD
      max_hourly_loss_percent: 0.35  # Hourly loss cap for intraday containment
      max_drawdown_percent: 4.5  # Max absolute drawdown (aligned with aggressive_mode)
      cooling_period_hours: 4  # Hours to wait after trigger
  
  orchestrator:
    enabled: true
    min_confidence: 0.35  # Lowered from 0.50 to 0.35 - allow more trades through
    consensus_threshold: 0.4  # Lowered from 0.5 to 0.4 - less strict consensus
    require_agent_agreement: false  # Keep false - allow single strong signals
    veto_enabled: true
    aggressive_mode: false  # Keep disabled for now
    risk_reward_ratio: 2.0  # Keep at 2.0 (1:2) - reasonable R/R
    # Common ratios: 1:2 (minimum), 1:3 (sweet spot), 1:5+ (requires precise entries)
    # Must match win rate: 50% win rate needs 1:2+, 40% needs 1:3+, 60% can work with 1:1.5
    # Agent weights for weighted voting (normalized automatically)
    technical_weight: 0.50  # Primary signal source - technical analysis
    sentiment_weight: 0.15  # News and sentiment analysis
    fundamental_weight: 0.10  # Fundamental analysis
    quantitative_weight: 0.20  # Statistical and quantitative models
    pattern_forecaster_weight: 0.15  # Historical pattern matching

# Risk Management Parameters
risk:
  max_drawdown_percent: 4.5  # Maximum drawdown before kill switch activates (aligned with aggressive_mode)
  position_size_percent: 1.0  # Reduced from 1.2% - more conservative base risk per trade
  max_position_size_percent: 4.0  # Reduced from 5.0% - align with risk manager setting, more conservative
  stop_loss_atr_multiplier: 2.0  # Stop loss distance in ATR multiples
  take_profit_atr_multiplier: 2.0  # Take profit distance in ATR multiples (aligned with 1:2 R/R)
  trailing_stop_enabled: true
  trailing_stop_atr_multiplier: 1.5
  dynamic_scaling:
    enabled: true  # Enable dynamic position sizing based on performance
    performance_threshold_sharpe: 1.2  # Increased from 1.0 - require better performance before scaling up
    max_risk_per_trade: 1.5  # Reduced from 2.0% - more conservative cap on risk per trade
    win_streak_bonus: 0.03  # Reduced from 0.05 - smaller compounding to avoid runaway sizing

# Portfolio-level risk controls
portfolio_risk:
  enabled: true
  max_exposure_percent: 20.0  # Portfolio gross exposure cap
  max_correlation: 0.7       # Do not add if portfolio correlation exceeds this
  max_sector_concentration: 0.5  # Limit concentration per sector/asset cluster
  max_correlated_positions: 5  # Increased from 3 to 5 - allow more positions per asset class
  max_correlated_pairs: 3  # Increased from 2 to 3 - allow more correlated pairs
  
# Trading Hours (UTC)
trading_hours:
  forex:
    enabled: true
    start_hour: 0  # 24-hour format
    end_hour: 24
    days: [monday, tuesday, wednesday, thursday, friday]
  
  crypto:
    enabled: true
    start_hour: 0
    end_hour: 24
    days: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]  # 24/7
  
  commodities:
    enabled: true
    start_hour: 0  # Precious metals trade similar to forex (24/5)
    end_hour: 24
    days: [monday, tuesday, wednesday, thursday, friday]
  
  stocks:
    enabled: true
    start_hour: 13  # 9:30 AM EST = 13:30 UTC
    end_hour: 20  # 4:00 PM EST = 20:00 UTC
    days: [monday, tuesday, wednesday, thursday, friday]

# Asset Classes to Trade
assets:
  crypto:
    enabled: true
    symbols:
      - BTC/USD
      - ETH/USD
      - SOL/USD
    broker: alpaca  # Using Alpaca for crypto trading
  
  forex:
    enabled: true
    symbols:
      - EUR/USD
      - GBP/USD
      - USD/JPY
    broker: oanda
  
  commodities:
    enabled: true
    symbols:
      - XAU/USD  # Gold
      - XAG/USD  # Silver
    broker: oanda  # OANDA supports precious metals
  
  stocks:
    enabled: true
    dynamic_discovery: true  # Enable news-based stock discovery
    max_concurrent_stocks: 15  # Maximum stocks to trade simultaneously
    min_sentiment_score: 0.5  # Minimum sentiment score for significant news
    discovery_refresh_hours: 1  # How often to refresh discovered stocks
    symbols: []  # Empty list - stocks will be discovered from news
    broker: alpaca

# Timeframes
timeframes:
  primary: 1h  # Primary timeframe for trading decisions
  analysis: [15m, 1h, 4h, 1d]  # Multiple timeframes for analysis

# Strategy Configuration
strategies:
  trend_following:
    enabled: true
    weight: 0.40  # Increased from 0.35 - primary strategy for 1h timeframe
    fast_ma_period: 20
    slow_ma_period: 50
  
  mean_reversion:
    enabled: true
    weight: 0.20  # Reduced from 0.25 - can conflict with trend following
    lookback_period: 14
    z_score_threshold: 2.0  # Increased from 1.5 - require stronger mean reversion signals
  
  ml_model:
    enabled: true
    weight: 0.3
    model_type: xgboost
    retrain_frequency_days: 7
  
  lstm_model:
    enabled: true
    weight: 0.15
    sequence_length: 60
    retrain_frequency_days: 14
  
  sentiment:
    enabled: true
    weight: 0.10  # Increased from 0.05 to 0.10 - news sentiment is important
    news_sources: [rss, twitter]
    update_frequency_minutes: 15
  
  breakout:
    enabled: true  # Enabled - breakout strategies can be profitable
    weight: 0.12  # Slightly reduced from 0.15
    lookback_period: 20
    breakout_threshold: 0.005  # 0.5%
    volume_threshold: 1.5
    use_atr: true
  
  momentum:
    enabled: true  # Enabled - momentum strategies complement trend following
    weight: 0.12  # Slightly reduced from 0.15
    rsi_period: 14
    rsi_oversold: 30
    rsi_overbought: 70
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    momentum_period: 10
    min_momentum: 0.015  # Reduced from 0.02 (2%) to 0.015 (1.5%) - allow weaker momentum
  
  volatility:
    enabled: true  # Enabled - volatility strategies help identify opportunities
    weight: 0.08  # Reduced from 0.1 - lower weight
    bb_period: 20
    bb_std: 2
    atr_period: 14
    low_volatility_threshold: 0.5
    high_volatility_threshold: 2.0
    volatility_expansion_factor: 1.5
  
  # CMC Markets Strategies
  news_trading:
    enabled: true
    weight: 0.15
    volatility_threshold: 0.015  # 1.5% minimum volatility
    volume_spike_multiplier: 1.5  # Volume must be 1.5x average
    price_movement_threshold: 0.005  # 0.5% minimum move
    use_pre_news: true
    use_post_news: true
  
  end_of_day:
    enabled: true
    weight: 0.12
    close_hour: 15  # 3 PM
    close_minute: 45
    min_price_change: 0.003  # 0.3% minimum
    compare_previous_day: true
  
  swing_trading:
    enabled: true
    weight: 0.18
    swing_period: 14
    rsi_period: 14
    rsi_oversold: 30
    rsi_overbought: 70
    min_swing_size: 0.02  # 2% minimum swing
    use_support_resistance: true
  
  day_trading:
    enabled: true
    weight: 0.15
    open_hour: 9
    close_hour: 16
    min_intraday_move: 0.005  # 0.5% minimum
    use_breakouts: true
    use_reversals: true
    max_trades_per_day: 5
  
  scalping:
    enabled: false  # Disabled by default - requires high volatility
    weight: 0.1
    min_volatility: 0.01  # 1% minimum volatility
    min_volume_multiplier: 2.0  # 2x average volume
    price_tick_size: 0.001  # 0.1% minimum move
    use_order_flow: true
    max_hold_time_minutes: 15

# Model Performance Monitoring
model_monitoring:
  performance_window_days: 30
  min_sharpe_ratio: 0.5
  min_accuracy: 0.52  # Minimum 52% accuracy to continue trading
  retrain_threshold: 0.48  # Retrain if accuracy drops below this

# Anomaly Detection
anomaly_detection:
  enabled: true
  contamination: 0.05  # Reduced from 0.1 to 0.05 - less sensitive to normal volatility
  reduce_position_on_anomaly: true
  position_reduction_factor: 0.75  # Reduced from 0.5 to 0.75 - less aggressive reduction

# Backtesting
backtesting:
  initial_capital: 10000.0
  commission_rate: 0.001  # 0.1% commission
  slippage_bps: 5  # 5 basis points slippage

