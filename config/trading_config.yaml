# ============================================================
# SmartTrader Configuration v3
# Updated: 2026-06-13
# Changes from v3.0:
#   - Fixed crypto symbol format: BTC/USDT -> BTC/USD (Alpaca standard)
#   - Replaced BNB/USDT with AVAX/USD (Alpaca supports AVAX, not BNB)
#   - Added commodities asset class: XAU_USD (Gold), XAG_USD (Silver)
#   - Added commodities to asset_class_strategy_config with calibrated params
#   - Commodities use OANDA broker (same as forex, native bracket orders)
# ============================================================

# Signal Log Mode
# When true: all signals are logged to logs/signals.jsonl but NO orders are placed
# Use this for 2 weeks to calibrate thresholds before turning it off
signal_log_mode: false  # LIVE TRADING ENABLED

# Aggressive Trading Mode
aggressive_mode:
  enabled: true
  target_monthly_return: 3.0     # Realistic: 3% per MONTH
  max_drawdown: 10
  use_drl: false                 # Re-enable once baseline is profitable
  volatility_scaling: true
  circuit_breakers: true

# Multi-Agent Framework
# Agent weights MUST sum to 1.0
agents:
  technical:
    enabled: true
    ml_weight: 0.3
    lstm_weight: 0.15

  sentiment:
    enabled: true
    sentiment_threshold: 0.30    # Lowered from 0.35 for calibration

  fundamental:
    enabled: true

  quantitative:
    enabled: true
    lookback_period: 100
    min_confidence: 0.45         # Lowered from 0.50 for calibration
    use_statistical_models: true
    use_momentum_models: true
    use_mean_reversion_models: true   # Re-enabled: separate toggle per regime

  pattern_forecaster:
    enabled: true
    pattern_length: 20
    lookahead_periods: 10
    min_matches: 2               # Lowered from 3 - more signals for calibration
    similarity_threshold: 0.60   # Lowered from 0.70 - wider net
    correlation_threshold: 0.55  # Lowered from 0.60
    historical_lookback_days: 180
    max_historical_records: 5000
    max_historical_bars: 2000
    analysis_timeout_seconds: 30

  regime_switching:
    enabled: true
    n_regimes: 4
    use_hmm: true
    lookback_period: 100

  risk_manager:
    enabled: true
    max_position_size_percent: 4.0
    max_drawdown_percent: 4.5
    min_liquidity_ratio: 0.1
    max_slippage_bps: 10
    veto_enabled: true
    circuit_breaker:
      # ATR-based thresholds - more adaptive than fixed %
      use_atr_based: true
      daily_loss_atr_multiple: 2.5    # Trip after 2.5x ATR daily loss
      hourly_loss_atr_multiple: 1.2   # Trip after 1.2x ATR hourly loss
      # Fallback fixed % if ATR is unavailable
      max_daily_loss_percent: 2.5
      max_hourly_loss_percent: 1.0
      max_drawdown_percent: 5.0
      cooling_period_hours: 2          # Reduced from 4 - less downtime per trip

  orchestrator:
    enabled: true
    min_confidence: 0.42         # LOWERED from 0.55 - calibration phase
    consensus_threshold: 0.42    # LOWERED from 0.55 - calibration phase
    require_agent_agreement: true
    min_agents_agreeing: 3       # Lowered from 4 - allow more signals through

# Strategy Weights (MUST sum to 1.0)
strategies:
  trend_following:
    enabled: true
    weight: 0.30
    regimes: [trending]

  momentum:
    enabled: true
    weight: 0.20
    regimes: [trending, neutral]

  breakout:
    enabled: true
    weight: 0.20
    regimes: [trending, volatile]

  mean_reversion:
    enabled: true               # RE-ENABLED - only in ranging regime
    weight: 0.15
    regimes: [ranging]

  scalping:
    enabled: false              # Disabled until execution latency is <100ms
    weight: 0.00

  day_trading:
    enabled: true
    weight: 0.15
    regimes: [trending, neutral, ranging]

# Asset Classes & Symbols
assets:
  crypto:
    enabled: true
    broker: alpaca              # Alpaca is the active crypto broker (Binance not yet integrated)
    fallback_broker: alpaca
    symbols:
      - BTC/USD                 # Fixed: was BTC/USDT (Alpaca uses USD not USDT)
      - ETH/USD                 # Fixed: was ETH/USDT
      - SOL/USD                 # Fixed: was SOL/USDT
      - AVAX/USD                # Replaced BNB/USDT — Alpaca supports AVAX, not BNB
    timeframe: 1h
    max_positions: 2
    trading_hours:
      allowed_days: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]

  forex:
    enabled: true
    broker: oanda
    symbols:
      - EUR_USD
      - GBP_USD
      - USD_JPY
      - AUD_USD
    timeframe: 1h
    max_positions: 2
    trading_hours:
      start: "00:00"
      end: "23:59"
      timezone: UTC
      exclude_weekends: true
      allowed_days: [monday, tuesday, wednesday, thursday, friday]

  commodities:
    enabled: true
    broker: oanda               # OANDA supports metals natively (XAU_USD, XAG_USD)
    symbols:
      - XAU_USD                 # Gold — highest liquidity metal on OANDA
      - XAG_USD                 # Silver — second most liquid
    timeframe: 1h
    max_positions: 1            # Conservative: only 1 metal position at a time
    trading_hours:
      start: "01:00"            # Metals open with Tokyo session
      end: "22:00"              # Close before NY session end
      timezone: UTC
      exclude_weekends: true
      allowed_days: [monday, tuesday, wednesday, thursday, friday]

  stocks:
    enabled: false              # Stage 3 - enable after crypto/forex profitable
    broker: alpaca
    symbols: []

# Risk Management
risk:
  max_portfolio_risk_percent: 2.0   # Max % of portfolio at risk at any time
  max_position_size_percent: 4.0
  default_stop_loss_atr_multiple: 1.5
  default_take_profit_rr_ratio: 2.0  # 1:2 R:R
  position_sizing_method: kelly      # 'fixed' | 'kelly' | 'volatility_adjusted'
  kelly_fraction: 0.25               # Use 25% Kelly (conservative)
  max_correlated_positions: 2        # Don't hold >2 highly-correlated positions


# ============================================================
# Per-Asset-Class Strategy Configuration
# These values override the global strategy defaults for each
# asset type.  Passed into generate_signal(data, symbol) so
# every symbol gets individually calibrated parameters.
# ============================================================
asset_class_strategy_config:

  crypto:
    min_confidence: 0.55         # Tighter than global 0.42 — crypto needs clear signals
    consensus_threshold: 0.55
    mean_reversion_enabled: false  # Never use mean reversion for crypto
    stop_loss_atr_multiple: 1.5    # Crypto ATR is already wide; tighten the multiple
    take_profit_rr_ratio: 2.5      # Higher reward target to offset volatile holding risk
    trend_following:
      use_ema: true                # EMA reacts faster to rapid crypto moves than SMA
      fast_ma_period: 10           # Faster crossover for crypto (SMA 20 is too slow)
      slow_ma_period: 25           # Faster slow MA (SMA 50 lags badly on crypto)
      adx_min_trend: 30            # Only trade crypto when ADX signals a strong trend
    momentum:
      rsi_oversold: 25             # Crypto capitulation reaches deeper oversold levels
      rsi_overbought: 75           # Crypto euphoria reaches higher overbought levels
      min_momentum: 0.05           # 5% min — filters out normal 1-2% crypto noise

  forex:
    min_confidence: 0.50
    consensus_threshold: 0.50
    mean_reversion_enabled: true   # Forex ranges reliably; mean reversion is valid
    stop_loss_atr_multiple: 1.5
    take_profit_rr_ratio: 2.0
    trend_following:
      use_ema: true                # EMA still preferred over SMA for responsiveness
      fast_ma_period: 10
      slow_ma_period: 30           # Slightly slower than crypto; forex trends more cleanly
      adx_min_trend: 20            # Lower bar; forex trends sustain longer
    momentum:
      rsi_oversold: 35             # Forex RSI extremes are less pronounced than crypto
      rsi_overbought: 65
      min_momentum: 0.005          # 0.5% min — forex moves in pips, not percent

  commodities:
    min_confidence: 0.52           # Between forex and crypto — metals trend well but slowly
    consensus_threshold: 0.52
    mean_reversion_enabled: true   # Gold/silver range widely around macro anchors
    stop_loss_atr_multiple: 2.0    # Metals are volatile intraday; wider stops needed
    take_profit_rr_ratio: 2.5      # Metals can run far on macro catalysts
    trend_following:
      use_ema: true                # EMA preferred; metals spike quickly on news
      fast_ma_period: 20           # Slower than forex — metals trend on daily/weekly
      slow_ma_period: 50           # Standard golden cross period for metals
      adx_min_trend: 22            # Slightly higher than forex; filter ranging sessions
    momentum:
      rsi_oversold: 32             # Metal oversold is less extreme than crypto
      rsi_overbought: 68
      min_momentum: 0.008          # 0.8% min — metals move ~0.5-1% on normal days

  stocks:
    min_confidence: 0.48
    consensus_threshold: 0.48
    mean_reversion_enabled: true
    stop_loss_atr_multiple: 2.0
    take_profit_rr_ratio: 2.0
    trend_following:
      use_ema: false               # SMA is fine for stocks; less whipsaw
      fast_ma_period: 20
      slow_ma_period: 50
      adx_min_trend: 20
    momentum:
      rsi_oversold: 30
      rsi_overbought: 70
      min_momentum: 0.02           # 2% min — standard stock noise filter


# Performance Gates (before enabling live trading)
live_trading_gates:
  min_paper_trading_days: 60
  min_sharpe_ratio: 1.0
  min_win_rate: 0.48
  max_drawdown_percent: 8.0
  min_profit_factor: 1.3
