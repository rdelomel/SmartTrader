# ============================================================
# SmartTrader Broker Configuration v3
# Updated: 2026-06-12
# Changes from v2:
#   - Added Binance as primary crypto broker (better liquidity/pairs)
#   - Alpaca kept as fallback for crypto and primary for stocks
#   - Added order_fill_timeout_seconds (poll for fill confirmation)
#   - Added reconnect config section
# SECURITY: Credentials must be in .env - never commit to version control
# ============================================================

brokers:
  binance:
    name: Binance
    type: crypto
    environment: testnet            # 'testnet' or 'live'
    testnet_url: https://testnet.binance.vision
    base_url: https://api.binance.com
    rate_limit: 1200                # Requests per minute (weight-based)
    supported_assets:
      - crypto
    order_types:
      - market
      - limit
      - stop_loss
      - take_profit
    min_order_size:
      BTC: 0.00001
      ETH: 0.0001
      default: 0.001
    timeout_seconds: 10
    order_fill_timeout_seconds: 60  # Poll for fill up to 60s
    retry:
      max_attempts: 5
      backoff_seconds: 2

  oanda:
    name: OANDA
    type: forex
    environment: paper              # 'paper' or 'live'
    base_url: https://api-fxtrade.oanda.com
    practice_url: https://api-fxpractice.oanda.com
    stream_url: https://stream-fxtrade.oanda.com
    practice_stream_url: https://stream-fxpractice.oanda.com
    rate_limit: 3000
    supported_assets:
      - forex
      - commodities
    order_types:
      - market
      - limit
      - stop_loss
      - take_profit
    min_order_size: 0.01
    timeout_seconds: 10
    order_fill_timeout_seconds: 30
    retry:
      max_attempts: 5
      backoff_seconds: 2

  alpaca:
    name: Alpaca
    type: stocks_crypto
    environment: paper              # 'paper' or 'live'
    base_url: https://api.alpaca.markets
    paper_url: https://paper-api.alpaca.markets
    data_url: https://data.alpaca.markets
    websocket_url: wss://stream.data.alpaca.markets/v1beta3
    paper_websocket_url: wss://stream.data.alpaca.markets/v1beta3
    rate_limit: 200
    supported_assets:
      - stocks
      - crypto
    order_types:
      - market
      - limit
      - stop_loss
      - take_profit
    min_order_size:
      stocks: 1
      crypto: 0.0001
    timeout_seconds: 10
    order_fill_timeout_seconds: 60
    retry:
      max_attempts: 5
      backoff_seconds: 2

# Default broker per asset class
default_brokers:
  crypto: binance          # PRIMARY: better liquidity, 500+ pairs, lower fees
  crypto_fallback: alpaca  # FALLBACK if Binance is unavailable
  forex: oanda
  commodities: oanda
  stocks: alpaca            # Stocks stage inactive until Stage 3

# Reconnect Configuration (used by BaseBroker.ensure_connected)
reconnect:
  max_attempts: 5
  base_delay_seconds: 2
  max_delay_seconds: 60

# ENVIRONMENT SWITCH CHECKLIST
# Before changing any environment from 'paper'/'testnet' to 'live':
#   [ ] All live_trading_gates met (see trading_config.yaml)
#   [ ] 60+ days profitable paper trading
#   [ ] Rotate API keys (never reuse paper keys for live)
#   [ ] Start with micro lot sizes (0.01 lots forex, 0.001 BTC)
