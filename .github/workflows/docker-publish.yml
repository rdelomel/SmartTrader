# .github/workflows/docker-publish.yml
# Triggers on every push to main.
# Builds Dockerfile.nas and pushes to Docker Hub as:
#   rdelomel/smarttrader:latest
#   rdelomel/smarttrader:<git-sha>
#
# Required GitHub repo secrets (Settings → Secrets → Actions):
#   DOCKERHUB_USERNAME   your Docker Hub username (e.g. rdelomel)
#   DOCKERHUB_TOKEN      Docker Hub access token (Hub → Account Settings → Security → New Token)

name: Build & Push Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up QEMU (for multi-arch if needed in future) ─────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ── 3. Set up Docker Buildx ──────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      # ── 4. Log in to Docker Hub ──────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 5. Extract short SHA for image tagging ───────────────────────────────
      - name: Extract short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # ── 6. Build & push ──────────────────────────────────────────────────────
      - name: Build and push SmartTrader image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.nas          # NAS-optimised, CPU-only, ~800 MB
          push: true
          # Cache layers in GitHub Actions cache for faster rebuilds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smarttrader:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smarttrader:${{ steps.vars.outputs.sha_short }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      # ── 7. Print pull command for convenience ────────────────────────────────
      - name: Print pull command
        run: |
          echo "✅ Image pushed successfully"
          echo "Pull command for TerraMaster:"
          echo "  docker pull ${{ secrets.DOCKERHUB_USERNAME }}/smarttrader:latest"
