# .github/workflows/docker-publish.yml
# Triggers on every push to main.
# Builds Dockerfile.nas and pushes to Docker Hub as:
#   rdelomel/smarttrader:latest
#   rdelomel/smarttrader:<git-sha>
#
# Required GitHub repo secrets (Settings → Secrets → Actions):
#   DOCKERHUB_USERNAME   your Docker Hub username (e.g. rdelomel)
#   DOCKERHUB_TOKEN      Docker Hub access token (Hub → Account Settings → Security → New Token)

name: Build & Push Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 0. Free disk (Torch/CPU image build OOMs disk on stock runners) ─────
      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo docker system prune -af || true
          sudo apt-get clean || true
          echo "After cleanup:"
          df -h

      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Docker Buildx ──────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      # ── 3. Log in to Docker Hub ──────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 4. Extract short SHA for image tagging ───────────────────────────────
      - name: Extract short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # ── 5. Build & push ──────────────────────────────────────────────────────
      - name: Build and push SmartTrader image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.nas          # NAS-optimised, CPU-only, ~800 MB
          push: true
          # mode=min uses less runner disk than mode=max (failed with ENOSPC)
          cache-from: type=gha
          cache-to: type=gha,mode=min
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smarttrader:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smarttrader:${{ steps.vars.outputs.sha_short }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      # ── 6. Print pull command for convenience ────────────────────────────────
      - name: Print pull command
        run: |
          echo "✅ Image pushed successfully"
          echo "Pull command for TerraMaster:"
          echo "  docker pull ${{ secrets.DOCKERHUB_USERNAME }}/smarttrader:latest"
